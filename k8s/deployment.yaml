apiVersion: apps/v1
kind: Deployment
metadata:
  name: devopslab-web
  namespace: dev
  labels:
    app: devopslab-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devopslab-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: devopslab-web
    spec:
      containers:
        - name: web
          image: devopslab-web:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          envFrom:
            - configMapRef:
                name: devopslab-config
            - secretRef:
                name: devopslab-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi